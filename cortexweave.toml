[server]
mcp_transport = "stdio"

[database]
path = "C:/dev/CortexWeave/.cortexweave/cortexweave.db"

[embedding]
base_url = "http://127.0.0.1:8081"
endpoint = "/v1/embeddings"
model = "nomic-embed-text-v1.5"
# Set this to make same-name embedding dimension changes trigger safe re-indexing.
# dimension = 768
batch_size = 1
timeout_seconds = 60
# Required retrieval instructions for nomic-embed-text-v1.5.
document_prefix = "search_document: "
query_prefix = "search_query: "

[embedding.limits]
max_input_tokens = 2048
max_batch_tokens = 4096
reserved_tokens = 32
tokenizer = "conservative_bytes"

[indexing]
debounce_ms = 300
max_file_bytes = 1048576
max_concurrent_embedding_jobs = 2
# Root-relative glob controls. Excludes take precedence over includes.
# include_patterns = ["src/**", "README.md"]
# exclude_patterns = ["src/generated/**"]

[indexing.generic_chunks]
target_chars = 900
overlap_chars = 100

[indexing.embedding_segments]
overlap_tokens = 64

[retrieval]
default_k = 8
semantic_weight = 0.70
lexical_weight = 0.30

[retrieval.structural]
enabled = true
weight = 0.20
max_depth = 3
candidate_limit = 32
distance_decay = 0.65
calls_weight = 1.0
references_weight = 0.8
implementations_weight = 1.0
tests_weight = 1.0
dependencies_weight = 0.8
other_weight = 0.6

[context]
candidate_pool_limit = 50
structural_expansion_limit = 4

[context.ranking]
semantic_weight = 0.24
lexical_weight = 0.16
task_weight = 0.14
working_set_weight = 0.14
recency_weight = 0.10
provenance_weight = 0.08
freshness_weight = 0.08
structural_weight = 0.06

[context.budget]
code_fraction = 0.50
structural_fraction = 0.20
memory_fraction = 0.15
event_fraction = 0.10
state_fraction = 0.05

[logging]
level = "info"

[languages]
rust = false
python = true
javascript = false
typescript = false
csharp = false
go = false
